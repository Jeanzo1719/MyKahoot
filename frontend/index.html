<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyKahoot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div id="confetti" class="confetti"></div>

    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" type="button">🌙</button>

    <h1>Actividad Humanismo Personalista</h1>

    <section id="start-screen" class="screen">
      <button id="start-button">Iniciar test</button>
    </section>

    <section id="form-screen" class="screen hidden">
      <form id="player-form">
        <label for="player-name">Nombre del jugador</label>
        <input type="text" id="player-name" name="player-name" required autocomplete="off" />
        <button type="submit">Comenzar</button>
      </form>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <p class="progress-label" id="progress"></p>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <h2 id="question-text"></h2>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback hidden">
        <p id="feedback-text" class="feedback-text"></p>
        <button id="next-button" type="button">Siguiente</button>
      </div>
    </section>

    <section id="round-screen" class="screen hidden">
      <h2 id="round-title">Fin de la ronda</h2>
      <p id="round-subtitle" class="round-subtitle"></p>
      <ol id="round-list" class="results-list"></ol>
      <button id="round-continue" type="button">Continuar</button>
    </section>

    <section id="results-screen" class="screen hidden">
      <h2>Resultados</h2>
      <ol id="results-list" class="results-list"></ol>
      <button id="restart-button">Volver a jugar</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
